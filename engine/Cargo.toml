[workspace]
resolver = "2"
members = [
    "crates/cb-core",
    "crates/cb-engine",
    "crates/cb-nats",
    "crates/cb-scheduler",
    "crates/cb-controller",
    "crates/cb-api",
    "crates/cb-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Circuit Breaker Team"]
license = "MIT"
repository = "https://github.com/circuit-breaker/circuit-breaker"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# NATS messaging
async-nats = "0.33"

# Kubernetes
kube = { version = "0.87", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.20", features = ["v1_28"] }
kube-runtime = "0.87"

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# gRPC (optional)
tonic = "0.10"
prost = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Validation & expressions
cel-interpreter = "0.8"
jsonschema = "0.17"

# Graph algorithms
petgraph = "0.6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
tracing-opentelemetry = "0.22"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
dashmap = "5.5"
parking_lot = "0.12"
futures = "0.3"
async-trait = "0.1"
bytes = "1.5"
url = "2.5"
base64 = "0.21"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Testing
tokio-test = "0.4"
wiremock = "0.5"
testcontainers = "0.15"
proptest = "1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

# Allow some pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
