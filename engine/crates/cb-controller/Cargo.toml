[package]
name = "cb-controller"
description = "Kubernetes operator for Circuit Breaker workflow orchestration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cb-controller"
path = "src/main.rs"

[dependencies]
# Internal crates
cb-core = { path = "../cb-core" }
cb-nats = { path = "../cb-nats" }
cb-engine = { path = "../cb-engine" }

# Kubernetes client
kube = { workspace = true }
k8s-openapi = { workspace = true }
kube-runtime = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

# CLI
clap = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

[features]
default = []
# Enable leader election for HA deployments
leader-election = []
# Enable webhook support for admission control
webhooks = []
